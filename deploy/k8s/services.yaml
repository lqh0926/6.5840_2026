# A headless Service has no virtual ClusterIP and does no load balancing.
# Instead, Kubernetes DNS publishes one stable record per StatefulSet Pod:
# raftkv-0.raftkv.raftkv.svc.cluster.local, raftkv-1..., raftkv-2....
apiVersion: v1
kind: Service
metadata:
  name: raftkv
  namespace: raftkv
  labels:
    app.kubernetes.io/name: raftkv
spec:
  clusterIP: None
  # Peer discovery must not depend on readiness; otherwise a new cluster can
  # deadlock while waiting for peers that DNS has not published yet.
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: raftkv
  ports:
    - name: peer
      port: 7000
      targetPort: rpc
      protocol: TCP
---
# This is the stable client-facing address inside the cluster. Until Step 7
# splits the two listeners, Service port 7001 forwards to the shared RPC
# listener on container port 7000. Step 7 will change targetPort to client.
apiVersion: v1
kind: Service
metadata:
  name: raftkv-client
  namespace: raftkv
  labels:
    app.kubernetes.io/name: raftkv
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: raftkv
  ports:
    - name: client
      port: 7001
      targetPort: rpc
      protocol: TCP
